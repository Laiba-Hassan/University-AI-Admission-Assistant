services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admission
    healthcheck:
      # TCP on 127.0.0.1 so it only passes once the real server is up, not the temporary init-time one.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d admission"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
volumes:
  pgdata:
