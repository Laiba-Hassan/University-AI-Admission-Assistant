services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admission
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
volumes:
  pgdata:
